<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="tb_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="tbglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#tb_bg)"/>
  <circle cx="680" cy="90" r="130" fill="#6366f1" opacity="0.1" filter="url(#tbglow)"/>
  <circle cx="120" cy="360" r="140" fill="#a855f7" opacity="0.1" filter="url(#tbglow)"/>

  <!-- Window Container -->
  <rect x="40" y="30" width="720" height="390" rx="16" fill="#0d1424" stroke="#1e293b" stroke-width="2"/>
  <rect x="40" y="30" width="720" height="46" rx="16" fill="#131c31"/>
  <rect x="40" y="60" width="720" height="16" fill="#131c31"/>
  <circle cx="68" cy="53" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="88" cy="53" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="108" cy="53" r="6" fill="#10b981" opacity="0.8"/>
  <text x="400" y="58" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">theeBloggers // Modern SaaS Publishing Platform &amp; Block Editor</text>

  <!-- Left: Block Editor UI Mockup -->
  <rect x="70" y="100" width="370" height="295" rx="12" fill="#0f172a" stroke="#253556" stroke-width="1.5"/>
  <rect x="70" y="100" width="370" height="38" rx="12" fill="#17223b"/>
  <rect x="70" y="125" width="370" height="13" fill="#17223b"/>
  <text x="90" y="124" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Notion-Style Block Editor</text>

  <g transform="translate(90, 155)">
    <text x="0" y="18" fill="#f8fafc" font-family="serif" font-size="16" font-weight="700">Engineering Distributed Systems at Scale</text>
    
    <rect y="32" width="330" height="40" rx="6" fill="#18233c"/>
    <text x="12" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">How we implemented ARIES crash recovery protocols...</text>
    <text x="12" y="66" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Paragraph Block • 8 min read</text>

    <!-- Slash Menu Command Popup -->
    <g transform="translate(15, 85)">
      <rect width="200" height="95" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" filter="url(#tbglow)"/>
      <text x="12" y="20" fill="#a5b4fc" font-family="monospace" font-size="10" font-weight="700">/ Commands</text>
      <rect x="8" y="28" width="184" height="20" rx="4" fill="#312e81"/>
      <text x="14" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">H1 Heading</text>
      <text x="14" y="62" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Code Block (C++ / TS)</text>
      <text x="14" y="82" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Paywall Lock Block</text>
    </g>
  </g>

  <!-- Right: Architecture & Monetization Panel -->
  <rect x="460" y="100" width="270" height="295" rx="12" fill="#111c33" stroke="#253556" stroke-width="1.5"/>
  
  <!-- Gemini Card -->
  <g transform="translate(480, 120)">
    <rect width="230" height="75" rx="8" fill="#172545" stroke="#a855f7" stroke-width="1"/>
    <text x="12" y="24" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Google Gemini 1.5 Flash</text>
    <text x="12" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">• Automated SEO excerpts</text>
    <text x="12" y="58" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">• Dynamic headline generation</text>
  </g>

  <!-- Stripe Paywall Card -->
  <g transform="translate(480, 210)">
    <rect width="230" height="75" rx="8" fill="#172545" stroke="#6366f1" stroke-width="1"/>
    <text x="12" y="24" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Stripe Creator Monetization</text>
    <text x="12" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">• Subscriber paywall gate</text>
    <text x="12" y="58" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">• Webhook payment settlement</text>
  </g>

  <!-- NextAuth & Prisma Strip -->
  <g transform="translate(480, 300)">
    <rect width="230" height="75" rx="8" fill="#172545" stroke="#10b981" stroke-width="1"/>
    <text x="12" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Auth &amp; Data Pipeline</text>
    <text x="12" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">• NextAuth v5 session cookies</text>
    <text x="12" y="58" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">• Prisma ORM + PostgreSQL</text>
  </g>
</svg>