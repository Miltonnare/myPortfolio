<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="cbbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#141d33"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#cbbg)"/>
  
  <!-- Window Container -->
  <rect x="50" y="35" width="700" height="380" rx="16" fill="#0d1527" stroke="#1e293b" stroke-width="2"/>
  <rect x="50" y="35" width="700" height="45" rx="16" fill="#141f38"/>
  <rect x="50" y="65" width="700" height="15" fill="#141f38"/>
  <circle cx="75" cy="58" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="95" cy="58" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="115" cy="58" r="6" fill="#10b981" opacity="0.8"/>
  <text x="400" y="63" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Chatbot- // Sub-Second Inference with Groq LPU &amp; LangChain Memory</text>

  <!-- Left: Architecture Flow -->
  <g transform="translate(80, 110)">
    <rect width="280" height="275" rx="10" fill="#131e36" stroke="#253556" stroke-width="1.5"/>
    <text x="140" y="30" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Low-Latency Inference Stack</text>

    <!-- FastAPI -->
    <rect x="25" y="55" width="230" height="45" rx="6" fill="#1a2949" stroke="#6366f1"/>
    <text x="140" y="77" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">FastAPI Asynchronous Gateway</text>
    <text x="140" y="91" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="9">Non-blocking Event Loop</text>

    <!-- Groq LPU -->
    <rect x="25" y="115" width="230" height="45" rx="6" fill="#1a2949" stroke="#f59e0b"/>
    <text x="140" y="137" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Groq LPU Acceleration</text>
    <text x="140" y="151" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9">Sub-200ms Token Generation</text>

    <!-- LangChain & Mongo -->
    <rect x="25" y="175" width="230" height="45" rx="6" fill="#1a2949" stroke="#10b981"/>
    <text x="140" y="197" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">LangChain Buffer Memory</text>
    <text x="140" y="211" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="9">Sliding Context Window</text>

    <!-- MongoDB Atlas -->
    <rect x="25" y="235" width="230" height="30" rx="4" fill="#17223b"/>
    <text x="140" y="255" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">MongoDB Atlas Persistent Store</text>
  </g>

  <!-- Right: Real Chat Preview -->
  <g transform="translate(390, 110)">
    <rect width="330" height="275" rx="10" fill="#0b1324" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="330" height="35" rx="10" fill="#13203c"/>
    <text x="165" y="22" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Live AI Chat Session // Render Deployment</text>

    <!-- User bubble -->
    <g transform="translate(50, 55)">
      <rect width="260" height="45" rx="8" fill="#4f46e5"/>
      <text x="14" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11">How does TF-IDF vectorize text corpora?</text>
      <text x="14" y="36" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="9">User • 10:42 AM</text>
    </g>

    <!-- AI bubble -->
    <g transform="translate(20, 115)">
      <rect width="290" height="85" rx="8" fill="#1a243c" stroke="#253556"/>
      <text x="14" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Groq LPU (180ms latency):</text>
      <text x="14" y="40" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">TF-IDF measures word significance by multiplying</text>
      <text x="14" y="55" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Term Frequency (TF) with Inverse Document</text>
      <text x="14" y="70" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Frequency (IDF), dampening ubiquitous terms.</text>
    </g>

    <rect x="20" y="225" width="290" height="35" rx="6" fill="#152037" stroke="#334155"/>
    <text x="32" y="247" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Type your technical inquiry...</text>
  </g>
</svg>