<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" fill="none">
  <defs>
    <linearGradient id="lw_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#lw_bg)"/>

  <!-- Top Title Bar -->
  <rect width="1000" height="42" fill="#0d1424" stroke="#1f293d" stroke-width="1"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>
  <text x="500" y="26" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">LuminaDB Studio // Transactional C++17 Relational Storage Engine</text>

  <!-- Left Sidebar (Schema Explorer) -->
  <rect x="0" y="42" width="220" height="558" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <text x="18" y="72" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DATABASE SCHEMAS</text>

  <g transform="translate(18, 92)">
    <text x="0" y="0" fill="#38bdf8" font-family="monospace" font-size="11">▼ lumina_prod</text>
    <text x="14" y="24" fill="#cbd5e1" font-family="monospace" font-size="11">▶ workers (slotted-page)</text>
    <text x="14" y="48" fill="#cbd5e1" font-family="monospace" font-size="11">▶ accounts (wal_logged)</text>
    <text x="14" y="72" fill="#cbd5e1" font-family="monospace" font-size="11">▶ escrow_txns (acid)</text>
    <text x="14" y="96" fill="#a5b4fc" font-family="monospace" font-size="11">★ bplus_pk_index</text>
    <text x="14" y="120" fill="#f59e0b" font-family="monospace" font-size="11">⚡ wal_log_buffer</text>
  </g>

  <!-- Main Query Area -->
  <rect x="220" y="42" width="780" height="35" fill="#111a2e" stroke="#1e293b" stroke-width="1"/>
  <rect x="220" y="42" width="160" height="35" fill="#17223b" stroke="#38bdf8" stroke-width="1"/>
  <text x="240" y="64" fill="#f1f5f9" font-family="monospace" font-size="11">query_executor.sql</text>

  <!-- Query Editor Area -->
  <rect x="220" y="77" width="780" height="180" fill="#0c1322"/>
  <g transform="translate(240, 110)">
    <text x="0" y="0" fill="#c084fc" font-family="monospace" font-size="13" font-weight="700">SELECT</text>
    <text x="65" y="0" fill="#f1f5f9" font-family="monospace" font-size="13">worker_id, full_name, trade, hourly_rate, rating</text>
    <text x="0" y="25" fill="#c084fc" font-family="monospace" font-size="13" font-weight="700">FROM</text>
    <text x="45" y="25" fill="#38bdf8" font-family="monospace" font-size="13">workers</text>
    <text x="0" y="50" fill="#c084fc" font-family="monospace" font-size="13" font-weight="700">WHERE</text>
    <text x="55" y="50" fill="#f1f5f9" font-family="monospace" font-size="13">trade = <tspan fill="#34d399">&apos;Electrical&apos;</tspan> AND county = <tspan fill="#34d399">&apos;Nairobi&apos;</tspan></text>
    <text x="0" y="75" fill="#c084fc" font-family="monospace" font-size="13" font-weight="700">ORDER BY</text>
    <text x="80" y="75" fill="#f1f5f9" font-family="monospace" font-size="13">rating DESC;</text>
  </g>

  <!-- Query Result Table -->
  <rect x="220" y="257" width="780" height="305" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <rect x="220" y="257" width="780" height="32" fill="#131c31"/>
  
  <!-- Table Header -->
  <text x="240" y="278" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700">WORKER_ID</text>
  <text x="360" y="278" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700">FULL_NAME</text>
  <text x="520" y="278" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700">TRADE</text>
  <text x="680" y="278" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700">HOURLY_RATE</text>
  <text x="820" y="278" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700">RATING</text>

  <!-- Row 1 -->
  <rect x="220" y="290" width="780" height="36" fill="#0f172a" opacity="0.6"/>
  <text x="240" y="313" fill="#38bdf8" font-family="monospace" font-size="12">W-1049</text>
  <text x="360" y="313" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">James Mwangi</text>
  <text x="520" y="313" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Master Electrician</text>
  <text x="680" y="313" fill="#34d399" font-family="monospace" font-size="12">KES 2,500/hr</text>
  <text x="820" y="313" fill="#fbbf24" font-family="monospace" font-size="12">★ 4.98</text>

  <!-- Row 2 -->
  <rect x="220" y="327" width="780" height="36" fill="#0b1120" opacity="0.6"/>
  <text x="240" y="350" fill="#38bdf8" font-family="monospace" font-size="12">W-2081</text>
  <text x="360" y="350" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Kevin Omondi</text>
  <text x="520" y="350" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Solar Technician</text>
  <text x="680" y="350" fill="#34d399" font-family="monospace" font-size="12">KES 2,200/hr</text>
  <text x="820" y="350" fill="#fbbf24" font-family="monospace" font-size="12">★ 4.92</text>

  <!-- Row 3 -->
  <rect x="220" y="364" width="780" height="36" fill="#0f172a" opacity="0.6"/>
  <text x="240" y="387" fill="#38bdf8" font-family="monospace" font-size="12">W-3412</text>
  <text x="360" y="387" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Dennis Kiprotich</text>
  <text x="520" y="387" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Domestic Wireman</text>
  <text x="680" y="387" fill="#34d399" font-family="monospace" font-size="12">KES 1,900/hr</text>
  <text x="820" y="387" fill="#fbbf24" font-family="monospace" font-size="12">★ 4.87</text>

  <!-- Bottom Telemetry Bar -->
  <rect y="562" width="1000" height="38" fill="#0a0e1a" stroke="#1f293d" stroke-width="1"/>
  <g transform="translate(20, 586)">
    <circle cx="0" cy="-4" r="4" fill="#10b981"/>
    <text x="12" y="0" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">STATUS: READY</text>
    <text x="150" y="0" fill="#94a3b8" font-family="monospace" font-size="11">B+Tree IndexScan: <tspan fill="#f1f5f9">0.14ms</tspan></text>
    <text x="350" y="0" fill="#94a3b8" font-family="monospace" font-size="11">Slotted-Pages Read: <tspan fill="#f1f5f9">3 x 4KB</tspan></text>
    <text x="540" y="0" fill="#94a3b8" font-family="monospace" font-size="11">WAL Flush: <tspan fill="#f1f5f9">1.1ms (LSN: 4192)</tspan></text>
    <text x="760" y="0" fill="#94a3b8" font-family="monospace" font-size="11">Fuzzing: <tspan fill="#34d399">ClusterFuzzLite 0 Errors</tspan></text>
  </g>
</svg>