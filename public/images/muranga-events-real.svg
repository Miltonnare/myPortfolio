<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" fill="none">
  <defs>
    <linearGradient id="me_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#141a29"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#me_bg)"/>

  <!-- Top Window Bar -->
  <rect width="1000" height="45" fill="#0d1424" stroke="#1f293d" stroke-width="1"/>
  <circle cx="24" cy="22" r="6" fill="#ef4444"/>
  <circle cx="44" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="22" r="6" fill="#10b981"/>
  <text x="500" y="27" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Murang&apos;a Events Reloaded // Full-Stack Event Ticketing &amp; Registration</text>

  <!-- Navigation -->
  <rect y="45" width="1000" height="50" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <text x="35" y="75" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="800">MURANG&apos;A EVENTS</text>
  <text x="210" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">DISCOVER • TICKETS • ORGANIZER DASHBOARD</text>

  <!-- Left: Featured Event Hero -->
  <rect x="35" y="115" width="560" height="450" rx="16" fill="#111c33" stroke="#253556" stroke-width="1.5"/>
  <rect x="55" y="135" width="520" height="200" rx="12" fill="#1a2744"/>
  
  <!-- Banner Graphic -->
  <g transform="translate(75, 175)">
    <rect width="120" height="26" rx="6" fill="#3b82f6"/>
    <text x="60" y="17" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">CAMPUS TECH SUMMIT</text>
    <text x="0" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Murang&apos;a Tech Innovators Summit 2026</text>
    <text x="0" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Main Auditorium • Murang&apos;a University of Technology</text>
  </g>

  <!-- Event Details & Ticket Tiers -->
  <g transform="translate(55, 355)">
    <text x="0" y="0" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Select Ticket Tier</text>

    <!-- Tier 1: Early Bird -->
    <rect y="15" width="250" height="70" rx="8" fill="#16233d" stroke="#10b981"/>
    <text x="15" y="38" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Early-Bird Student</text>
    <text x="15" y="56" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Free Admission (Active)</text>
    <text x="235" y="48" text-anchor="end" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="800">KES 0</text>

    <!-- Tier 2: VIP / Delegate -->
    <rect x="270" y="15" width="250" height="70" rx="8" fill="#16233d" stroke="#334155"/>
    <text x="285" y="38" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">VIP / Workshop Pass</text>
    <text x="285" y="56" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Includes Lunch &amp; Swag</text>
    <text x="505" y="48" text-anchor="end" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="800">KES 1,500</text>
  </g>

  <!-- Right: Ticket Checkout & QR Code Modal -->
  <rect x="620" y="115" width="345" height="450" rx="16" fill="#111c33" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="620" y="115" width="345" height="40" rx="16" fill="#172747"/>
  <text x="640" y="140" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Verified Ticket Pass</text>

  <!-- Simulated QR Code -->
  <g transform="translate(682, 180)">
    <rect width="220" height="220" rx="12" fill="#ffffff"/>
    <!-- QR Grid pattern -->
    <rect x="15" y="15" width="55" height="55" fill="#000000"/>
    <rect x="25" y="25" width="35" height="35" fill="#ffffff"/>
    <rect x="35" y="35" width="15" height="15" fill="#000000"/>

    <rect x="150" y="15" width="55" height="55" fill="#000000"/>
    <rect x="160" y="25" width="35" height="35" fill="#ffffff"/>
    <rect x="170" y="35" width="15" height="15" fill="#000000"/>

    <rect x="15" y="150" width="55" height="55" fill="#000000"/>
    <rect x="25" y="160" width="35" height="35" fill="#ffffff"/>
    <rect x="35" y="170" width="15" height="15" fill="#000000"/>

    <!-- Data matrix dots -->
    <g fill="#000000">
      <rect x="85" y="20" width="15" height="25"/>
      <rect x="115" y="20" width="20" height="15"/>
      <rect x="85" y="60" width="30" height="20"/>
      <rect x="130" y="55" width="25" height="30"/>
      <rect x="30" y="85" width="40" height="20"/>
      <rect x="80" y="95" width="50" height="25"/>
      <rect x="150" y="90" width="35" height="30"/>
      <rect x="90" y="135" width="25" height="40"/>
      <rect x="130" y="135" width="45" height="25"/>
      <rect x="90" y="180" width="50" height="25"/>
      <rect x="155" y="175" width="35" height="30"/>
    </g>
  </g>

  <g transform="translate(640, 425)">
    <text x="0" y="0" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700">TICKET-ID: MUT-2026-9812</text>
    <text x="0" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Holder: Milton Odhiambo (Organizer)</text>
    <rect y="35" width="305" height="36" rx="8" fill="#10b981"/>
    <text x="152" y="58" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✓ Validated at Gate Scanner</text>
  </g>
</svg>