<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" fill="none">
  <defs>
    <linearGradient id="aura_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#aura_bg)"/>

  <!-- Terminal Top Bar -->
  <rect width="1000" height="42" fill="#0e1526" stroke="#1e293b" stroke-width="1"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>
  <text x="500" y="26" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Aura Document Processor // Java 17 AST Layout Compiler &amp; ClusterFuzzLite Harness</text>

  <!-- Terminal Body -->
  <g transform="translate(35, 80)" font-family="monospace" font-size="13" line-height="1.6">
    <text y="0" fill="#38bdf8">$ ./gradlew :core:test :fuzz:runJazzerFuzzer --continuous</text>
    <text y="28" fill="#10b981">&gt; Task :core:compileJava UP-TO-DATE</text>
    <text y="52" fill="#94a3b8">&gt; Task :core:processResources UP-TO-DATE</text>
    <text y="76" fill="#94a3b8">[Aura::Codec] Initialized LZ77 sliding dictionary (window_size: 4096 bytes)</text>
    <text y="100" fill="#94a3b8">[Aura::Tokenizer] Lexing XON structured document template...</text>
    <text y="124" fill="#a5b4fc">[Aura::AST] Built DOM Node Graph (Nodes: 1,420, Depth: 8) with Topological Sort</text>
    <text y="148" fill="#10b981">[Aura::Validation] Cycle detection: 0 cyclic dependencies detected</text>
    <text y="180" fill="#fbbf24">=== ClusterFuzzLite Continuous Fuzzing Execution ===</text>
    <text y="204" fill="#cbd5e1">INFO: Running 1 Jazzer target (com.aura.fuzz.XonParserFuzzer)</text>
    <text y="228" fill="#cbd5e1">#1200000 pulse cov: 1420 ft: 3820 corp: 450/48Kb lim: 4096 exec/s: 14200</text>
    <text y="252" fill="#cbd5e1">#2400000 pulse cov: 1428 ft: 3894 corp: 482/52Kb lim: 4096 exec/s: 15100</text>
    <text y="276" fill="#34d399">✓ 3,500,000 fuzz iterations completed without unhandled exceptions or leaks</text>
  </g>

  <!-- Lower Architecture Card Layer -->
  <rect x="35" y="380" width="930" height="190" rx="12" fill="#0d1424" stroke="#253556" stroke-width="1.5"/>
  <text x="60" y="415" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Decoupled Processing Architecture</text>

  <g transform="translate(60, 435)">
    <!-- Box 1 -->
    <rect width="195" height="105" rx="8" fill="#16233d" stroke="#334155"/>
    <text x="15" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1. XON Tokenizer</text>
    <text x="15" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Streaming lexical parser</text>
    <text x="15" y="72" fill="#cbd5e1" font-family="monospace" font-size="10">Zero-copy buffers</text>

    <!-- Box 2 -->
    <rect x="220" width="195" height="105" rx="8" fill="#16233d" stroke="#334155"/>
    <text x="235" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2. LZ77 Codecs</text>
    <text x="235" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">High-ratio binary compression</text>
    <text x="235" y="72" fill="#cbd5e1" font-family="monospace" font-size="10">Run-Length Encoding</text>

    <!-- Box 3 -->
    <rect x="440" width="195" height="105" rx="8" fill="#16233d" stroke="#334155"/>
    <text x="455" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">3. Graph Validator</text>
    <text x="455" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Topological DAG evaluation</text>
    <text x="455" y="72" fill="#10b981" font-family="monospace" font-size="10">No cyclic recursion</text>

    <!-- Box 4 -->
    <rect x="660" width="210" height="105" rx="8" fill="#16233d" stroke="#10b981"/>
    <text x="675" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">4. Jazzer Fuzz Harness</text>
    <text x="675" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Continuous mutation testing</text>
    <text x="675" y="72" fill="#10b981" font-family="monospace" font-size="10">ClusterFuzzLite CI</text>
  </g>
</svg>