<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="aibg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141a2e"/>
    </linearGradient>
    <filter id="aiglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#aibg)"/>
  <circle cx="400" cy="225" r="160" fill="#6366f1" opacity="0.08" filter="url(#aiglow)"/>

  <!-- Window container -->
  <rect x="50" y="35" width="700" height="380" rx="16" fill="#0d1426" stroke="#1e293b" stroke-width="2"/>
  <rect x="50" y="35" width="700" height="45" rx="16" fill="#141e36"/>
  <rect x="50" y="65" width="700" height="15" fill="#141e36"/>
  <circle cx="75" cy="58" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="95" cy="58" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="115" cy="58" r="6" fill="#10b981" opacity="0.8"/>
  <text x="400" y="63" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">AuthenticityAI // Evidence-First NLI &amp; Vector Consistency Pipeline</text>

  <!-- Step 1: Statement Ingestion -->
  <g transform="translate(80, 115)">
    <rect width="180" height="120" rx="10" fill="#15213b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. Statement Corpus</text>
    <text x="90" y="58" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Hansard &amp; Press Audio</text>
    <text x="90" y="80" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Timestamped Transcripts</text>
    <text x="90" y="100" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">SHA-256 Content Hash</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M260 175 H295" stroke="#6366f1" stroke-width="2"/>
  <polygon points="300,175 292,171 292,179" fill="#6366f1"/>

  <!-- Step 2: Embedding & Vector Search -->
  <g transform="translate(305, 115)">
    <rect width="190" height="120" rx="10" fill="#15213b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="95" y="32" text-anchor="middle" fill="#818cf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. Vector Search</text>
    <text x="95" y="58" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Sentence Transformers</text>
    <text x="95" y="80" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Cosine Similarity Index</text>
    <text x="95" y="100" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">Top-K Historical Claims</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M495 175 H530" stroke="#6366f1" stroke-width="2"/>
  <polygon points="535,175 527,171 527,179" fill="#6366f1"/>

  <!-- Step 3: NLI Inference Engine -->
  <g transform="translate(540, 115)">
    <rect width="180" height="120" rx="10" fill="#15213b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3. NLI Engine</text>
    <text x="90" y="58" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Cross-Encoder Class</text>
    <text x="90" y="80" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="10">Entailment</text>
    <text x="90" y="100" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="10">Contradiction (Score)</text>
  </g>

  <!-- Bottom Panel: Output Verification Matrix -->
  <rect x="80" y="260" width="640" height="130" rx="10" fill="#10182b" stroke="#253556" stroke-width="1.5"/>
  <text x="105" y="290" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Evidence Audit Verification Panel</text>
  
  <rect x="105" y="308" width="590" height="32" rx="6" fill="#18233c"/>
  <text x="120" y="328" fill="#94a3b8" font-family="monospace" font-size="11">Claim 2024: "Budget deficit was under 3.5%"</text>
  <rect x="580" y="313" width="100" height="22" rx="4" fill="#ef4444" opacity="0.2"/>
  <text x="630" y="328" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="10" font-weight="700">Contradiction 94%</text>

  <rect x="105" y="348" width="590" height="32" rx="6" fill="#18233c"/>
  <text x="120" y="368" fill="#94a3b8" font-family="monospace" font-size="11">Hansard 2022: "Official treasury record stated deficit exceeded 6.2%"</text>
  <text x="630" y="368" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">Verified Transcript [00:14:22]</text>
</svg>