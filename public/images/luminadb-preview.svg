<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="wal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800" />
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" />
  </g>

  <!-- Decorative Glow -->
  <circle cx="650" cy="120" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <circle cx="150" cy="350" r="120" fill="#06b6d4" opacity="0.1" filter="url(#glow)"/>

  <!-- Window Header -->
  <rect x="50" y="35" width="700" height="380" rx="16" fill="#0d1424" stroke="#1e293b" stroke-width="2"/>
  <rect x="50" y="35" width="700" height="45" rx="16" fill="#131c31"/>
  <rect x="50" y="65" width="700" height="15" fill="#131c31"/>
  <circle cx="75" cy="58" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="95" cy="58" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="115" cy="58" r="6" fill="#10b981" opacity="0.8"/>
  <text x="400" y="63" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">LuminaDB // C++17 Transactional Database Architecture</text>

  <!-- Architecture Boxes -->
  <!-- Box 1: SQL Parser & Lexer -->
  <rect x="80" y="110" width="180" height="90" rx="10" fill="#17223b" stroke="#334155" stroke-width="1.5"/>
  <text x="170" y="140" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">SQL Parser &amp; Lexer</text>
  <text x="170" y="162" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Recursive Descent</text>
  <text x="170" y="180" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">AST Generation</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M260 155 H300" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="305,155 297,151 297,159" fill="#6366f1"/>

  <!-- Box 2: Query Executor -->
  <rect x="310" y="110" width="180" height="90" rx="10" fill="#17223b" stroke="#334155" stroke-width="1.5"/>
  <text x="400" y="140" text-anchor="middle" fill="#818cf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Execution Engine</text>
  <text x="400" y="162" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">SeqScan | IndexScan</text>
  <text x="400" y="180" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Filter &amp; Project Nodes</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M490 155 H530" stroke="#6366f1" stroke-width="2"/>
  <polygon points="535,155 527,151 527,159" fill="#6366f1"/>

  <!-- Box 3: B+Tree Index -->
  <rect x="540" y="110" width="180" height="90" rx="10" fill="#17223b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="630" y="140" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">B+Tree Index</text>
  <text x="630" y="162" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">O(log n) Key Lookup</text>
  <text x="630" y="180" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="10">Internal / Leaf Splits</text>

  <!-- Middle Connector Layer -->
  <path d="M400 200 V235" stroke="#6366f1" stroke-width="2"/>
  <polygon points="400,240 396,232 404,232" fill="#6366f1"/>

  <!-- Box 4: Slotted Page Storage & Buffer Manager -->
  <rect x="80" y="245" width="300" height="135" rx="10" fill="#111c33" stroke="#6366f1" stroke-width="1.5"/>
  <text x="230" y="275" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Slotted-Page Storage Manager</text>
  <text x="230" y="297" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">4KB Pages • PageHeader • Slot Array</text>
  <!-- Mini page slots visual -->
  <g transform="translate(105, 315)">
    <rect x="0" y="0" width="55" height="42" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="27" y="24" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">Slot 0</text>
    <rect x="65" y="0" width="55" height="42" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="92" y="24" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">Slot 1</text>
    <rect x="130" y="0" width="55" height="42" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="157" y="24" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">Slot 2</text>
    <rect x="195" y="0" width="55" height="42" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="222" y="24" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="9">Free</text>
  </g>

  <!-- Box 5: WAL Recovery Engine (ARIES) -->
  <rect x="420" y="245" width="300" height="135" rx="10" fill="#1a1c2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="570" y="275" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Write-Ahead Log (WAL) // ARIES</text>
  <text x="570" y="297" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Crash Consistency &amp; Atomicity</text>
  <!-- Mini log sequence visual -->
  <g transform="translate(445, 315)">
    <rect x="0" y="0" width="75" height="42" rx="4" fill="#2d2218" stroke="#b45309"/>
    <text x="37" y="18" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9">LSN: 101</text>
    <text x="37" y="32" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="8">BEGIN</text>

    <rect x="85" y="0" width="75" height="42" rx="4" fill="#2d2218" stroke="#b45309"/>
    <text x="122" y="18" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9">LSN: 102</text>
    <text x="122" y="32" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="8">UPDATE</text>

    <rect x="170" y="0" width="75" height="42" rx="4" fill="#2d2218" stroke="#b45309"/>
    <text x="207" y="18" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9">LSN: 103</text>
    <text x="207" y="32" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="8">COMMIT</text>
  </g>
</svg>